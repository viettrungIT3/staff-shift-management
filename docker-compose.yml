services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_USER=duty_user
      - DB_PASSWORD=duty_pass
      - DB_NAME=duty_db
      - MQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniopass
      - MINIO_BUCKET=roster-images
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_USER=duty_user
      - DB_PASSWORD=duty_pass
      - DB_NAME=duty_db
      - MQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=duty_db
      - MYSQL_USER=duty_user
      - MYSQL_PASSWORD=duty_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=miniopass
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql_data:
  minio_data:
