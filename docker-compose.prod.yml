version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=duty_user
      - DB_PASSWORD=duty_pass
      - DB_NAME=duty_db
      - MQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniopass
      - MINIO_BUCKET=roster-images
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - MQ_URL=amqp://guest:guest@rabbitmq:5672
    deploy:
      replicas: 2

  mysql:
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=duty_db
      - MYSQL_USER=duty_user
      - MYSQL_PASSWORD=duty_pass

volumes:
  mysql_data:
